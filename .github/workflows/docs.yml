name: Docs

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "snapboost/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      snapshot_version:
        description: "Publish this build under /vX.Y.Z/ (e.g. v0.1.7). Leave empty to publish as latest at /."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Resolve docs version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.snapshot_version }}" ]]; then
            VERSION="${{ inputs.snapshot_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved DOCS_VERSION=$VERSION"

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build HTML
        env:
          DOCS_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd docs
          make html

      - name: Assemble site (preserve /v*/ trees)
        if: github.event_name != 'pull_request'
        env:
          DOCS_VERSION: ${{ steps.ver.outputs.version }}
          SITE_URL: https://snapboost.qiancapital.com
        run: python3 docs/_scripts/assemble_site.py

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: >
      github.event_name != 'pull_request' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
