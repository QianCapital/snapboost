[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "snapboost"
version = "0.1.6"
description = "SnapBoost heterogeneous Newton boosting with decision trees and RFF ridge regressors"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Qian Capital", email = "samson.qian@qiancapital.com"}]
keywords = ["boosting", "gradient-boosting", "snapboost", "heterogeneous-newton"]
dependencies = [
    "hnbm>=0.1.1",
    "numpy>=1.20",
    "scikit-learn>=1.0",
    "tqdm>=4.50",
]

[project.urls]
Homepage = "https://github.com/qiancapital/snapboost"
Documentation = "https://qiancapital.github.io/snapboost/"
Repository = "https://github.com/qiancapital/snapboost"

[tool.setuptools.packages.find]
where = ["."]
include = ["snapboost*"]
