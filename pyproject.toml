[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "snapboost"
version = "0.1.7"
description = "SnapBoost heterogeneous Newton boosting with decision trees and RFF ridge regressors"
readme = "README.md"
license = {text = "MIT"}
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{name = "Qian Capital", email = "samson.qian@qiancapital.com"}]
keywords = ["boosting", "gradient-boosting", "snapboost", "heterogeneous-newton"]
dependencies = [
    "hnbm>=0.2.2",
    "numpy>=1.20",
    "scikit-learn>=1.0",
    "tqdm>=4.50",
]

[project.optional-dependencies]
examples = [
    "jupyter>=1.0",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "xgboost>=1.5",
    "lightgbm>=3.3",
]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/qiancapital/snapboost"
Documentation = "https://snapboost.qiancapital.com/"
Repository = "https://github.com/qiancapital/snapboost"

[tool.setuptools.packages.find]
where = ["."]
include = ["snapboost*"]
